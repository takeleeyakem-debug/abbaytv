<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Detail - AbbayTV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0A0A0A;
            color: #FFFFFF;
            line-height: 1.6;
        }
        .navbar {
            background-color: #000000;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            padding: 0.8rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #000;
        }
        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #FFD700;
            text-decoration: none;
        }
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            background: transparent;
            border: none;
            padding: 10px;
        }
        .hamburger span {
            width: 25px;
            height: 3px;
            background: #FFD700;
            margin: 3px 0;
            transition: all 0.3s ease;
            border-radius: 3px;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        .nav-links a {
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: #FFD700; }
        .live-nav-link { color: #FF0000 !important; font-weight: bold; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .nav-right { display: flex; gap: 1rem; align-items: center; }
        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
            color: #000000;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3); }
        .btn-secondary {
            background-color: transparent;
            border: 2px solid #FFD700;
            color: #FFD700;
        }
        .btn-secondary:hover { background-color: rgba(255, 215, 0, 0.1); }
        .btn-success {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: white;
        }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3); }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .job-header {
            background: linear-gradient(145deg, #1A1A1A 0%, #0D0D0D 100%);
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .job-title { color: #FFD700; font-size: 2rem; margin-bottom: 0.5rem; }
        .job-meta { display: flex; gap: 1.5rem; flex-wrap: wrap; margin: 1rem 0; color: #B8860B; }
        .job-type {
            background: rgba(255, 215, 0, 0.1);
            color: #FFD700;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .job-description {
            background: linear-gradient(145deg, #1A1A1A 0%, #0D0D0D 100%);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .contact-bar {
            background: linear-gradient(135deg, #1A1A1A 0%, #0D0D0D 100%);
            padding: 1rem;
            text-align: center;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            margin-top: 2rem;
        }
        .footer { background-color: #000000; border-top: 2px solid rgba(255, 215, 0, 0.3); padding: 2rem; text-align: center; }
        @media (max-width: 768px) {
            .hamburger { display: flex; }
            .nav-links {
                position: fixed;
                left: -100%;
                top: 70px;
                flex-direction: column;
                background-color: #000000;
                width: 80%;
                height: calc(100vh - 70px);
                padding: 2rem;
                transition: left 0.3s ease;
            }
            .nav-links.active { left: 0; }
            .nav-right { flex-direction: column; width: 100%; }
            .job-title { font-size: 1.5rem; }
            .job-meta { flex-direction: column; gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <div class="logo-icon">📺</div>
                <span class="logo-text">AbbayTV</span>
            </a>
            <button class="hamburger" id="hamburger-btn">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="news.html">News</a>
                <a href="programs.html">Programs</a>
                <a href="live.html" class="live-nav-link">🔴 Live</a>
                <a href="jobs.html">Jobs</a>
                <div class="nav-right">
                    <a href="login.html" class="btn btn-secondary">Login</a>
                    <a href="signup.html" class="btn btn-primary">Sign Up</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <a href="jobs.html" class="btn btn-secondary" style="margin-bottom: 1rem;">← Back to Jobs</a>
        
        <div class="job-header">
            <h1 class="job-title" id="jobTitle">Loading...</h1>
            <div class="job-meta" id="jobMeta"></div>
        </div>
        
        <div class="job-description">
            <h3 style="color: #FFD700; margin-bottom: 1rem;">Job Description</h3>
            <p id="jobDescription" style="color: #CCCCCC; line-height: 1.8;">Loading...</p>
            
            <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgba(255, 215, 0, 0.2);">
                <button class="btn btn-success" onclick="applyForJob()">📝 Apply for this Position</button>
            </div>
        </div>
    </div>

    <div class="contact-bar">
        <p>📺 DEMO. For full job application system with resume upload, <a href="#" onclick="showContactAlert()">Contact Us</a></p>
    </div>

    <footer class="footer">
        <p>&copy; 2025 AbbayTV. Demo Version.</p>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const title = decodeURIComponent(urlParams.get('title') || 'Journalist');
        const company = decodeURIComponent(urlParams.get('company') || 'AbbayTV');
        const location = decodeURIComponent(urlParams.get('location') || 'Addis Ababa');
        const jobType = decodeURIComponent(urlParams.get('type') || 'Full-time');
        const salary = decodeURIComponent(urlParams.get('salary') || 'Competitive');
        const description = decodeURIComponent(urlParams.get('desc') || 'Looking for an experienced journalist to cover news and events. Must have strong writing skills and be able to work under pressure.');

        document.getElementById('jobTitle').textContent = title;
        document.getElementById('jobMeta').innerHTML = `
            <span>🏢 ${company}</span>
            <span>📍 ${location}</span>
            <span><span class="job-type">${jobType}</span></span>
            <span>💰 ${salary}</span>
        `;
        document.getElementById('jobDescription').innerHTML = description + '<br><br><strong>Requirements:</strong><br>• Bachelor\'s degree in related field<br>• 2+ years of experience<br>• Excellent communication skills<br><br><strong>Benefits:</strong><br>• Competitive salary<br>• Health insurance<br>• Professional development opportunities';

        function applyForJob() {
            alert("Application feature available in full version!\n\nIn the complete website, users can:\n✅ Submit applications online\n✅ Upload resumes\n✅ Track application status\n✅ Receive email notifications\n\nContact us to get the full system.");
        }

        function showContactAlert() {
            alert("📧 Get full AbbayTV:\n\n✅ Flask Backend\n✅ SQLite/PostgreSQL Database\n✅ Admin Dashboard\n✅ User Authentication\n✅ Job Application System\n✅ Resume Upload\n✅ Email Notifications\n\nContact: demo@abbaytv.com");
        }

        const hamburger = document.getElementById('hamburger-btn');
        const navLinksEl = document.getElementById('navLinks');
        if (hamburger) {
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                navLinksEl.classList.toggle('active');
            });
        }
    </script>
</body>
</html>
