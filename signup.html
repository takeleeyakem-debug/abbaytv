<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AbbayTV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0A0A0A 0%, #1A1A1A 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* Auth Card */
        .auth-card {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            color: #FFD700;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .auth-header p {
            color: #B8860B;
            font-size: 0.9rem;
        }

        /* Logo */
        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem auto;
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #FFD700;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 0.9rem 1rem;
            background: #000000;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            color: #FFFFFF;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .form-input::placeholder {
            color: #444;
        }

        /* Password Strength */
        .password-strength {
            margin-top: 0.5rem;
            font-size: 0.8rem;
        }

        .strength-bar {
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .strength-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        /* Terms Checkbox */
        .terms-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1rem 0;
        }

        .terms-checkbox input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #FFD700;
        }

        .terms-checkbox label {
            color: #B8860B;
            font-size: 0.85rem;
        }

        .terms-checkbox a {
            color: #FFD700;
            text-decoration: none;
        }

        .terms-checkbox a:hover {
            text-decoration: underline;
        }

        /* Button */
        .auth-button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
            color: #000000;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        .auth-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
        }

        /* Footer */
        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            color: #B8860B;
        }

        .auth-footer a {
            color: #FFD700;
            text-decoration: none;
            font-weight: 500;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* Contact Bar */
        .contact-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #1A1A1A 0%, #0D0D0D 100%);
            padding: 0.8rem;
            text-align: center;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            font-size: 0.85rem;
        }

        .contact-bar a {
            color: #FFD700;
            text-decoration: none;
        }

        .contact-bar a:hover {
            text-decoration: underline;
        }

        /* Error/Success Messages */
        .error-message {
            color: #FF4444;
            font-size: 0.75rem;
            margin-top: 0.3rem;
            display: block;
        }

        .success-message {
            color: #44FF44;
            font-size: 0.75rem;
            margin-top: 0.3rem;
            display: block;
        }

        /* Alert */
        .alert {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            animation: slideIn 0.3s ease;
        }

        .alert-danger {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #FF4444;
            color: #FF8888;
        }

        .alert-success {
            background: rgba(68, 255, 68, 0.2);
            border: 1px solid #44FF44;
            color: #88FF88;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .auth-card {
                padding: 1.5rem;
            }
            .auth-header h1 {
                font-size: 1.5rem;
            }
            body {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="logo-icon">📺</div>
        
        <div class="auth-header">
            <h1>Create Account</h1>
            <p>Join AbbayTV community today</p>
        </div>

        <!-- Alert Container -->
        <div id="alertContainer"></div>

        <!-- Signup Form -->
        <form id="signupForm">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-input" id="username" placeholder="johndoe" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" id="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="password" placeholder="Create a strong password" required>
                <div class="password-strength" id="passwordStrength">
                    <div class="strength-bar">
                        <div class="strength-bar-fill" id="strengthFill"></div>
                    </div>
                    <div id="strengthText" style="margin-top: 0.3rem;"></div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-input" id="confirmPassword" placeholder="Re-enter password" required>
            </div>

            <div class="terms-checkbox">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the <a href="#" onclick="showTerms()">Terms of Service</a> and <a href="#" onclick="showPrivacy()">Privacy Policy</a></label>
            </div>

            <button type="submit" class="auth-button">Create Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Sign in here</a>
        </div>
    </div>

    <div class="contact-bar">
        <p>📺 DEMO VERSION. For full website with backend, database, and authentication, <a href="#" onclick="showContactAlert()">Contact Us</a></p>
    </div>

    <script>
        // Get DOM elements
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const termsCheckbox = document.getElementById('terms');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');
        const alertContainer = document.getElementById('alertContainer');

        // Password strength calculation
        function calculatePasswordStrength(password) {
            let strength = 0;
            let feedback = [];

            if (password.length === 0) {
                return { strength: 0, text: '', color: '#333', width: '0%' };
            }

            // Length check
            if (password.length >= 8) {
                strength++;
                feedback.push('✓ 8+ characters');
            } else {
                feedback.push('✗ Need 8+ characters');
            }

            // Lowercase check
            if (/[a-z]/.test(password)) {
                strength++;
                feedback.push('✓ Has lowercase');
            } else {
                feedback.push('✗ Need lowercase');
            }

            // Uppercase check
            if (/[A-Z]/.test(password)) {
                strength++;
                feedback.push('✓ Has uppercase');
            } else {
                feedback.push('✗ Need uppercase');
            }

            // Number check
            if (/[0-9]/.test(password)) {
                strength++;
                feedback.push('✓ Has number');
            } else {
                feedback.push('✗ Need number');
            }

            // Special character check
            if (/[^a-zA-Z0-9]/.test(password)) {
                strength++;
                feedback.push('✓ Has special char');
            } else {
                feedback.push('✗ Need special char');
            }

            // Determine display
            const strengths = ['Very Weak', 'Weak', 'Fair', 'Good', 'Strong', 'Very Strong'];
            const colors = ['#FF4444', '#FF7744', '#FFAA44', '#FFD700', '#AAFF44', '#44FF44'];
            const widths = ['20%', '40%', '60%', '80%', '90%', '100%'];

            return {
                strength: strength,
                text: strengths[strength],
                color: colors[strength],
                width: widths[strength],
                feedback: feedback
            };
        }

        // Update password strength display
        function updatePasswordStrength() {
            const password = passwordInput.value;
            const result = calculatePasswordStrength(password);
            
            strengthFill.style.width = result.width;
            strengthFill.style.backgroundColor = result.color;
            
            if (password.length === 0) {
                strengthText.innerHTML = '';
            } else {
                strengthText.innerHTML = `<span style="color: ${result.color};">${result.text}</span>`;
            }
        }

        // Check password match
        function checkPasswordMatch() {
            if (confirmInput.value.length === 0) return true;
            
            if (passwordInput.value !== confirmInput.value) {
                confirmInput.style.borderColor = '#FF4444';
                confirmInput.style.boxShadow = '0 0 10px rgba(255, 68, 68, 0.3)';
                return false;
            } else {
                confirmInput.style.borderColor = '#44FF44';
                confirmInput.style.boxShadow = '0 0 10px rgba(68, 255, 68, 0.3)';
                return true;
            }
        }

        // Show alert message
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = message;
            alertContainer.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.style.opacity = '0';
                alertDiv.style.transition = 'opacity 0.3s';
                setTimeout(() => alertDiv.remove(), 300);
            }, 4000);
        }

        // Validate email format
        function isValidEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        // Validate username
        function isValidUsername(username) {
            return username.length >= 3 && /^[a-zA-Z0-9_]+$/.test(username);
        }

        // Show Terms
        function showTerms() {
            alert("Terms of Service:\n\n1. You must be 18+ to use this service\n2. Content is for informational purposes only\n3. Do not misuse or abuse the platform\n4. Respect other users\n5. AbbayTV reserves all rights\n\nFull terms available in complete version.");
        }

        // Show Privacy Policy
        function showPrivacy() {
            alert("Privacy Policy:\n\nWe collect:\n- Name and email address\n- Usage data\n- Comments and interactions\n\nWe protect your data and never share with third parties.\n\nFull privacy policy in complete version.");
        }

        // Show Contact Alert
        function showContactAlert() {
            alert("📧 CONTACT US FOR FULL ABBAYTV:\n\n✅ Complete Flask Backend\n✅ SQLite/PostgreSQL Database\n✅ User Authentication System\n✅ Admin Dashboard\n✅ YouTube API Integration\n✅ Live Streaming\n✅ Comment & Like System\n✅ Job Application System\n✅ Mobile Responsive\n✅ Custom Domain\n\n📞 Phone: +251 XXX XXX XXX\n📧 Email: info@abbaytv.com\n\nWe'll discuss pricing and timeline!");
        }

        // Handle form submission
        function handleSignup(e) {
            e.preventDefault();
            
            // Get values
            const username = usernameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirm = confirmInput.value;
            const terms = termsCheckbox.checked;
            
            // Clear previous alerts
            alertContainer.innerHTML = '';
            
            // Validate username
            if (!username) {
                showAlert('❌ Username is required', 'danger');
                usernameInput.focus();
                return;
            }
            
            if (!isValidUsername(username)) {
                showAlert('❌ Username must be at least 3 characters and contain only letters, numbers, and underscores', 'danger');
                usernameInput.focus();
                return;
            }
            
            // Validate email
            if (!email) {
                showAlert('❌ Email is required', 'danger');
                emailInput.focus();
                return;
            }
            
            if (!isValidEmail(email)) {
                showAlert('❌ Please enter a valid email address', 'danger');
                emailInput.focus();
                return;
            }
            
            // Validate password
            if (!password) {
                showAlert('❌ Password is required', 'danger');
                passwordInput.focus();
                return;
            }
            
            if (password.length < 6) {
                showAlert('❌ Password must be at least 6 characters', 'danger');
                passwordInput.focus();
                return;
            }
            
            // Confirm password
            if (password !== confirm) {
                showAlert('❌ Passwords do not match', 'danger');
                confirmInput.focus();
                return;
            }
            
            // Check terms
            if (!terms) {
                showAlert('❌ You must agree to the Terms of Service', 'danger');
                return;
            }
            
            // All valid - demo signup
            showAlert('✅ Account created successfully! Redirecting to login...', 'success');
            
            // Store demo user info
            localStorage.setItem('demoUser', JSON.stringify({
                username: username,
                email: email,
                registeredAt: new Date().toISOString()
            }));
            
            // Redirect to login after 2 seconds
            setTimeout(() => {
                window.location.href = 'login.html?registered=true';
            }, 2000);
        }

        // Real-time validation events
        passwordInput.addEventListener('input', () => {
            updatePasswordStrength();
            checkPasswordMatch();
        });
        
        confirmInput.addEventListener('input', checkPasswordMatch);
        
        usernameInput.addEventListener('input', () => {
            if (usernameInput.value.length > 0 && !isValidUsername(usernameInput.value)) {
                usernameInput.style.borderColor = '#FF4444';
            } else {
                usernameInput.style.borderColor = 'rgba(255, 215, 0, 0.3)';
            }
        });
        
        emailInput.addEventListener('input', () => {
            if (emailInput.value.length > 0 && !isValidEmail(emailInput.value)) {
                emailInput.style.borderColor = '#FF4444';
            } else {
                emailInput.style.borderColor = 'rgba(255, 215, 0, 0.3)';
            }
        });
        
        // Form submit handler
        document.getElementById('signupForm').addEventListener('submit', handleSignup);
        
        // Initial password strength
        updatePasswordStrength();

        // Check for registration success from URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('registered') === 'true') {
            showAlert('✅ Registration successful! Please login.', 'success');
        }
    </script>
</body>
</html>
