<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programs - AbbayTV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0A0A0A;
            color: #FFFFFF;
            line-height: 1.6;
        }
        .navbar {
            background-color: #000000;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            padding: 0.8rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #000;
        }
        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #FFD700;
            text-decoration: none;
        }
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            background: transparent;
            border: none;
            padding: 10px;
        }
        .hamburger span {
            width: 25px;
            height: 3px;
            background: #FFD700;
            margin: 3px 0;
            transition: all 0.3s ease;
            border-radius: 3px;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        .nav-links a {
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: #FFD700; }
        .live-nav-link { color: #FF0000 !important; font-weight: bold; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .nav-right { display: flex; gap: 1rem; align-items: center; }
        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
            color: #000000;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3); }
        .btn-secondary {
            background-color: transparent;
            border: 2px solid #FFD700;
            color: #FFD700;
        }
        .btn-secondary:hover { background-color: rgba(255, 215, 0, 0.1); }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        h1 { color: #FFD700; margin-bottom: 2rem; }
        .filter-bar {
            background: linear-gradient(145deg, #1A1A1A 0%, #0D0D0D 100%);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        .filter-group { display: flex; gap: 1rem; flex-wrap: wrap; }
        .filter-input { flex: 2; min-width: 200px; padding: 0.8rem; background: #000; border: 1px solid #FFD700; border-radius: 6px; color: #FFF; }
        .filter-select { flex: 1; min-width: 150px; padding: 0.8rem; background: #000; border: 1px solid #FFD700; border-radius: 6px; color: #FFF; }
        .thumbnail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        .thumbnail-card {
            background: linear-gradient(145deg, #1A1A1A 0%, #0D0D0D 100%);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 0, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .thumbnail-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 215, 0, 0.5);
        }
        .thumbnail-image {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
        }
        .video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #333, #1a1a1a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        .thumbnail-content { padding: 1.2rem; }
        .thumbnail-title { color: #FFD700; font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }
        .thumbnail-meta { color: #B8860B; font-size: 0.8rem; margin-bottom: 0.5rem; }
        .contact-bar {
            background: linear-gradient(135deg, #1A1A1A 0%, #0D0D0D 100%);
            padding: 1rem;
            text-align: center;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            margin-top: 2rem;
        }
        .footer { background-color: #000000; border-top: 2px solid rgba(255, 215, 0, 0.3); padding: 2rem; text-align: center; }
        @media (max-width: 768px) {
            .hamburger { display: flex; }
            .nav-links {
                position: fixed;
                left: -100%;
                top: 70px;
                flex-direction: column;
                background-color: #000000;
                width: 80%;
                height: calc(100vh - 70px);
                padding: 2rem;
                transition: left 0.3s ease;
            }
            .nav-links.active { left: 0; }
            .nav-right { flex-direction: column; width: 100%; }
            .filter-group { flex-direction: column; }
            .thumbnail-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <div class="logo-icon">📺</div>
                <span class="logo-text">AbbayTV</span>
            </a>
            <button class="hamburger" id="hamburger-btn">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="news.html">News</a>
                <a href="programs.html">Programs</a>
                <a href="live.html" class="live-nav-link">🔴 Live</a>
                <a href="jobs.html">Jobs</a>
                <div class="nav-right">
                    <a href="login.html" class="btn btn-secondary">Login</a>
                    <a href="signup.html" class="btn btn-primary">Sign Up</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Our Programs</h1>
        
        <div class="filter-bar">
            <div class="filter-group">
                <input type="text" class="filter-input" placeholder="Search programs..." id="searchInput">
                <select class="filter-select" id="categorySelect">
                    <option value="all">All Categories</option>
                    <option value="talk">Talk Shows</option>
                    <option value="tech">Technology</option>
                    <option value="music">Music</option>
                </select>
                <button class="btn btn-primary" onclick="filterPrograms()">Apply Filters</button>
            </div>
        </div>

        <div class="thumbnail-grid" id="programsGrid"></div>

        <div style="text-align: center; padding: 2rem;">
            <button class="btn btn-secondary" onclick="loadMore()">Load More</button>
        </div>
    </div>

    <div class="contact-bar">
        <p>📺 DEMO version. For full website with backend, database, and admin panel, <a href="#" onclick="showContactAlert()">Contact Us</a></p>
    </div>

    <footer class="footer">
        <p>&copy; 2025 AbbayTV. Demo Version.</p>
    </footer>

    <script>
        let allPrograms = [
            { title: 'Morning Show with Abebe', host: 'Abebe Kebede', category: 'talk', desc: 'Start your day with news and entertainment.', videoId: 'dQw4w9WgXcQ' },
            { title: 'Tech Talk Ethiopia', host: 'Meron Tesfaye', category: 'tech', desc: 'Latest in technology and innovation.', videoId: 'jfKfPfyJRdk' },
            { title: 'Music Hour', host: 'Teddy Afro', category: 'music', desc: 'Best Ethiopian music performances.', videoId: '5qap5aO4i9A' },
            { title: 'Sports Roundup', host: 'Mulugeta Haile', category: 'sports', desc: 'Weekly sports highlights.', videoId: 'MgFeTeO9QgY' },
            { title: 'Business Review', host: 'Hiwot Ayele', category: 'business', desc: 'Economic news and analysis.', videoId: 'dQw4w9WgXcQ' }
        ];
        let visibleCount = 4;

        function loadPrograms() {
            const grid = document.getElementById('programsGrid');
            const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
            const category = document.getElementById('categorySelect')?.value || 'all';
            
            let filtered = allPrograms.filter(p => {
                const matchSearch = p.title.toLowerCase().includes(searchTerm) || p.desc.toLowerCase().includes(searchTerm);
                const matchCategory = category === 'all' || p.category === category;
                return matchSearch && matchCategory;
            });
            
            const toShow = filtered.slice(0, visibleCount);
            grid.innerHTML = toShow.map(p => `
                <div class="thumbnail-card" onclick="window.location.href='program-detail.html?id=${p.videoId}&title=${encodeURIComponent(p.title)}&desc=${encodeURIComponent(p.desc)}&host=${encodeURIComponent(p.host)}'">
                    <div class="thumbnail-image"><div class="video-placeholder">📺</div></div>
                    <div class="thumbnail-content">
                        <h3 class="thumbnail-title">${p.title}</h3>
                        <div class="thumbnail-meta">Hosted by ${p.host} • 👁️ ${Math.floor(Math.random() * 10000)} views</div>
                        <p class="thumbnail-description">${p.desc}</p>
                    </div>
                </div>
            `).join('');
        }

        function filterPrograms() { visibleCount = 4; loadPrograms(); }
        function loadMore() { visibleCount += 4; loadPrograms(); }
        function showContactAlert() {
            alert("📧 Get full AbbayTV:\n✅ Flask Backend\n✅ Database\n✅ Admin Panel\n✅ YouTube API\n✅ Live Streaming\n✅ User System\n✅ Custom Domain\n\nContact: demo@abbaytv.com");
        }

        const hamburger = document.getElementById('hamburger-btn');
        const navLinksEl = document.getElementById('navLinks');
        if (hamburger) {
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                navLinksEl.classList.toggle('active');
            });
        }
        loadPrograms();
    </script>
</body>
</html>
