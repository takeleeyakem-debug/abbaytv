<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Detail - AbbayTV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0A0A0A;
            color: #FFFFFF;
            line-height: 1.6;
        }
        .navbar {
            background-color: #000000;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            padding: 0.8rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #000;
        }
        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #FFD700;
            text-decoration: none;
        }
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            background: transparent;
            border: none;
            padding: 10px;
        }
        .hamburger span {
            width: 25px;
            height: 3px;
            background: #FFD700;
            margin: 3px 0;
            transition: all 0.3s ease;
            border-radius: 3px;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        .nav-links a {
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: #FFD700; }
        .live-nav-link { color: #FF0000 !important; font-weight: bold; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .nav-right { display: flex; gap: 1rem; align-items: center; }
        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
            color: #000000;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3); }
        .btn-secondary {
            background-color: transparent;
            border: 2px solid #FFD700;
            color: #FFD700;
        }
        .btn-secondary:hover { background-color: rgba(255, 215, 0, 0.1); }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            margin: 1.5rem 0;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .news-title { color: #FFD700; font-size: 2rem; margin-bottom: 0.5rem; }
        .news-meta { color: #B8860B; margin-bottom: 1rem; display: flex; gap: 1rem; }
        .news-content { color: #CCCCCC; line-height: 1.8; margin-top: 1rem; }
        .contact-bar {
            background: linear-gradient(135deg, #1A1A1A 0%, #0D0D0D 100%);
            padding: 1rem;
            text-align: center;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            margin-top: 2rem;
        }
        .footer { background-color: #000000; border-top: 2px solid rgba(255, 215, 0, 0.3); padding: 2rem; text-align: center; }
        .like-section { display: flex; gap: 1rem; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgba(255, 215, 0, 0.2); }
        @media (max-width: 768px) {
            .hamburger { display: flex; }
            .nav-links {
                position: fixed;
                left: -100%;
                top: 70px;
                flex-direction: column;
                background-color: #000000;
                width: 80%;
                height: calc(100vh - 70px);
                padding: 2rem;
                transition: left 0.3s ease;
            }
            .nav-links.active { left: 0; }
            .nav-right { flex-direction: column; width: 100%; }
            .news-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <div class="logo-icon">📺</div>
                <span class="logo-text">AbbayTV</span>
            </a>
            <button class="hamburger" id="hamburger-btn">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="news.html">News</a>
                <a href="programs.html">Programs</a>
                <a href="live.html" class="live-nav-link">🔴 Live</a>
                <a href="jobs.html">Jobs</a>
                <div class="nav-right">
                    <a href="login.html" class="btn btn-secondary">Login</a>
                    <a href="signup.html" class="btn btn-primary">Sign Up</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <a href="news.html" class="btn btn-secondary" style="margin-bottom: 1rem;">← Back to News</a>
        
        <div class="news-title" id="newsTitle">Loading...</div>
        <div class="news-meta" id="newsMeta"></div>
        
        <div class="video-wrapper" id="videoWrapper"></div>
        
        <div class="news-content" id="newsContent">Loading content...</div>
        
        <div class="like-section">
            <button class="btn btn-secondary" id="likeBtn">❤️ Like (0)</button>
            <button class="btn btn-secondary" onclick="alert('Comment section available in full version! Contact us for backend.')">💬 Comment</button>
        </div>
    </div>

    <div class="contact-bar">
        <p>📺 This is a DEMO. For full version with working comments, likes, and database, <a href="#" onclick="showContactAlert()">Contact Us</a></p>
    </div>

    <footer class="footer">
        <p>&copy; 2025 AbbayTV. Demo Version.</p>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id') || 'dQw4w9WgXcQ';
        const title = decodeURIComponent(urlParams.get('title') || 'Ethiopia Launches New Development Project');
        const desc = decodeURIComponent(urlParams.get('desc') || 'The Ethiopian government has announced a major infrastructure development project that aims to boost economic growth and create thousands of jobs across the country.');

        document.getElementById('newsTitle').textContent = title;
        document.getElementById('newsContent').innerHTML = `<p>${desc}</p><p style="margin-top: 1rem;">This is a demonstration of how the news detail page would look. In the full version, content would be stored in a database and managed through an admin panel.</p>`;
        document.getElementById('newsMeta').innerHTML = `<span>Published on March 15, 2025</span><span>👁️ 1,234 views</span><span>📁 Category: News</span>`;
        document.getElementById('videoWrapper').innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>`;

        let likes = 0;
        const likeBtn = document.getElementById('likeBtn');
        likeBtn.addEventListener('click', () => {
            likes++;
            likeBtn.innerHTML = `❤️ Like (${likes})`;
            likeBtn.style.background = "linear-gradient(135deg, #FFD700 0%, #B8860B 100%)";
            likeBtn.style.color = "#000";
            setTimeout(() => {
                alert("Like recorded! In full version, this saves to database.");
            }, 100);
        });

        function showContactAlert() {
            alert("📧 Get the complete AbbayTV website:\n\n✅ Full Flask Backend\n✅ SQLite/PostgreSQL Database\n✅ Admin Dashboard\n✅ User Authentication\n✅ YouTube API Integration\n✅ Live Streaming\n✅ Comment & Like System\n✅ Mobile Responsive\n✅ Custom Domain\n\nContact us: demo@abbaytv.com");
        }

        // Hamburger menu
        const hamburger = document.getElementById('hamburger-btn');
        const navLinksEl = document.getElementById('navLinks');
        if (hamburger) {
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                navLinksEl.classList.toggle('active');
            });
        }
    </script>
</body>
</html>
