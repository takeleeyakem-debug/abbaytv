<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Jobs - ABBAY TV ETHIOPIA</title>
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Side Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay"></div>
    
    <!-- Side Menu -->
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <div class="menu-logo">ABBAY TV</div>
            <button class="close-menu" id="closeMenu"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="menu-search">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="menuSearchInput" placeholder="Search...">
        </div>
        
        <nav class="menu-nav">
            <a href="index.html" class="menu-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="news.html" class="menu-item">
                <i class="fas fa-newspaper"></i>
                <span>News</span>
            </a>
            <a href="programs.html" class="menu-item">
                <i class="fas fa-tv"></i>
                <span>Programs</span>
            </a>
            <a href="live.html" class="menu-item">
                <i class="fas fa-circle"></i>
                <span>Live</span>
            </a>
            <a href="jobs.html" class="menu-item active">
                <i class="fas fa-briefcase"></i>
                <span>Jobs</span>
            </a>
            <a href="contact.html" class="menu-item">
                <i class="fas fa-envelope"></i>
                <span>Contact</span>
            </a>
        </nav>
        
        <div class="menu-social">
            <a href="#" class="social-icon"><i class="fab fa-facebook"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-youtube"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-telegram"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-tiktok"></i></a>
        </div>
    </div>

    <!-- Top Navigation -->
    <header class="top-nav">
        <button class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
        </button>
        <div class="logo">ABBAY TV <span class="gold-text">ETHIOPIA</span></div>
        <button class="search-toggle" id="searchToggle">
            <i class="fas fa-search"></i>
        </button>
    </header>

    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-container">
            <input type="text" id="globalSearchInput" placeholder="Search jobs...">
            <button id="closeSearch"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container" id="mainContent">
        <h1 class="page-title">Career Opportunities</h1>
        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner"></div>
        </div>
        <div class="content-grid" id="contentGrid"></div>
    </main>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="news.html" class="bottom-nav-item">
            <i class="fas fa-newspaper"></i>
            <span>News</span>
        </a>
        <a href="programs.html" class="bottom-nav-item">
            <i class="fas fa-tv"></i>
            <span>Shows</span>
        </a>
        <a href="live.html" class="bottom-nav-item">
            <i class="fas fa-circle"></i>
            <span>Live</span>
        </a>
        <a href="jobs.html" class="bottom-nav-item active">
            <i class="fas fa-briefcase"></i>
            <span>Jobs</span>
        </a>
    </nav>

    <!-- Back to Top Button -->
    <button class="back-to-top" id="backToTop">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Video Modal -->
    <div class="video-modal" id="videoModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="video-container">
                <iframe id="youtubePlayer" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
