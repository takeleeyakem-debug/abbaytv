<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Contact - ABBAY TV ETHIOPIA</title>
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Side Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay"></div>
    
    <!-- Side Menu -->
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <div class="menu-logo">ABBAY TV</div>
            <button class="close-menu" id="closeMenu"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="menu-search">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="menuSearchInput" placeholder="Search...">
        </div>
        
        <nav class="menu-nav">
            <a href="index.html" class="menu-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="news.html" class="menu-item">
                <i class="fas fa-newspaper"></i>
                <span>News</span>
            </a>
            <a href="programs.html" class="menu-item">
                <i class="fas fa-tv"></i>
                <span>Programs</span>
            </a>
            <a href="live.html" class="menu-item">
                <i class="fas fa-circle"></i>
                <span>Live</span>
            </a>
            <a href="jobs.html" class="menu-item">
                <i class="fas fa-briefcase"></i>
                <span>Jobs</span>
            </a>
            <a href="contact.html" class="menu-item active">
                <i class="fas fa-envelope"></i>
                <span>Contact</span>
            </a>
        </nav>
        
        <div class="menu-social">
            <a href="#" class="social-icon"><i class="fab fa-facebook"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-youtube"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-telegram"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-tiktok"></i></a>
        </div>
    </div>

    <!-- Top Navigation -->
    <header class="top-nav">
        <button class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
        </button>
        <div class="logo">ABBAY TV <span class="gold-text">ETHIOPIA</span></div>
        <button class="search-toggle" id="searchToggle">
            <i class="fas fa-search"></i>
        </button>
    </header>

    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-container">
            <input type="text" id="globalSearchInput" placeholder="Search...">
            <button id="closeSearch"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container">
        <h1 class="page-title">Contact Us</h1>
        
        <div class="contact-container">
            <div class="contact-info">
                <h2>Get in Touch</h2>
                <p>We'd love to hear from you. Send us a message and we'll respond as soon as possible.</p>
                
                <div class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>Bole Sub-city, Addis Ababa, Ethiopia</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-phone"></i>
                    <span>+251-11-123-4567</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-envelope"></i>
                    <span>info@abbaytv.et</span>
                </div>
            </div>
            
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
        
        <div class="recent-messages">
            <h2>Recent Messages</h2>
            <div class="loading-spinner" id="messagesSpinner">
                <div class="spinner"></div>
            </div>
            <div class="messages-grid" id="messagesGrid"></div>
        </div>
    </main>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="news.html" class="bottom-nav-item">
            <i class="fas fa-newspaper"></i>
            <span>News</span>
        </a>
        <a href="programs.html" class="bottom-nav-item">
            <i class="fas fa-tv"></i>
            <span>Shows</span>
        </a>
        <a href="live.html" class="bottom-nav-item">
            <i class="fas fa-circle"></i>
            <span>Live</span>
        </a>
        <a href="jobs.html" class="bottom-nav-item">
            <i class="fas fa-briefcase"></i>
            <span>Jobs</span>
        </a>
    </nav>

    <!-- Back to Top Button -->
    <button class="back-to-top" id="backToTop">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <script src="main.js"></script>
</body>
</html>
