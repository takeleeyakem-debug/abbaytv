<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABBAY TV • News</title>
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-theme">
    <!-- SIDE MENU (same as index) -->
    <div class="menu-overlay" id="menuOverlay"></div>
    
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <div class="menu-close" id="closeMenu"><i class="fas fa-arrow-left"></i></div>
            <div class="menu-logo">
                <img src="https://tse3.mm.bing.net/th/id/OIP.ORz2qWwloYPBTWgHSTnCKAHaHa" alt="ABBAY TV">
                <span>ABBAY TV</span>
            </div>
        </div>
        
        <div class="menu-search">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="globalSearch" placeholder="Search...">
        </div>
        <div class="search-results" id="searchResults"></div>
        
        <div class="menu-links">
            <a href="index.html" class="menu-link">Home</a>
            <a href="news.html" class="menu-link active">News</a>
            <a href="programs.html" class="menu-link">Programs</a>
            <a href="live.html" class="menu-link">Live</a>
            <a href="jobs.html" class="menu-link">Jobs</a>
            <a href="contact.html" class="menu-link">Contact</a>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <!-- TOP NAV -->
        <header class="top-nav">
            <div class="nav-left">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                <div class="logo-text"><span class="gold">ABBAY</span> NEWS</div>
            </div>
        </header>

        <!-- CATEGORY TABS -->
        <div class="category-tabs">
            <button class="category-tab active" data-category="all">All</button>
            <button class="category-tab" data-category="Politics">Politics</button>
            <button class="category-tab" data-category="Sports">Sports</button>
            <button class="category-tab" data-category="Economy">Economy</button>
            <button class="category-tab" data-category="Culture">Culture</button>
        </div>

        <!-- NEWS GRID -->
        <div class="news-grid" id="newsContainer">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i> Loading news...
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="news.html" class="bottom-nav-item active"><i class="fas fa-newspaper"></i><span>News</span></a>
        <a href="programs.html" class="bottom-nav-item"><i class="fas fa-tv"></i><span>Shows</span></a>
        <a href="live.html" class="bottom-nav-item"><i class="fas fa-circle" style="color: #ff0000;"></i><span>Live</span></a>
        <a href="jobs.html" class="bottom-nav-item"><i class="fas fa-briefcase"></i><span>Jobs</span></a>
    </nav>

    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('News page loaded, fetching news.json...');
            if (typeof loadNewsPage === 'function') {
                loadNewsPage();
            } else {
                document.getElementById('newsContainer').innerHTML = 
                    '<div class="error">Error: JavaScript not loaded properly</div>';
            }
        });
    </script>
</body>
</html>
